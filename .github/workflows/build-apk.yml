name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 4. Generate Native Android Project & Download App Icon
        run: |
          mkdir -p android-app/app/src/main/java/com/mhmedia/invoice
          mkdir -p android-app/app/src/main/res/xml
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/assets

          # Salin index.html ke dalam APK
          cp index.html android-app/app/src/main/assets/index.html

          # Download logo aplikasi dari URL Anda
          curl -L "https://iili.io/CSCl9SI.png" -o android-app/app/src/main/res/drawable/ic_launcher.png

          # 1. Buat settings.gradle
          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NotaMHMedia"
          include ':app'
          EOF

          # 2. Buat root build.gradle
          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          # 3. Buat gradle.properties
          cat << 'EOF' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. Buat app/build.gradle
          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mhmedia.invoice'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mhmedia.invoice"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          # 5. Buat file_paths.xml untuk izin kirim PDF/JPG ke WhatsApp
          cat << 'EOF' > android-app/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_invoices" path="." />
          </paths>
          EOF

          # 6. Buat AndroidManifest.xml (Full Screen Tanpa ActionBar)
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="Nota MH MEDIA"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 7. Buat MainActivity.java lengkap dengan Jembatan Share WA & Download PDF
          cat << 'EOF' > android-app/app/src/main/java/com/mhmedia/invoice/MainActivity.java
          package com.mhmedia.invoice;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#2b1d28"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidNative");

                  webView.loadUrl("https://milshasya-dev.github.io/notamhmedia/?v=" + System.currentTimeMillis());
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void shareFile(String base64Data, String fileName, String mimeType, String caption) {
                      try {
                          String pureBase64 = base64Data.contains(",") ? base64Data.split(",")[1] : base64Data;
                          byte[] decodedBytes = Base64.decode(pureBase64, Base64.DEFAULT);

                          File cacheFile = new File(getCacheDir(), fileName);
                          FileOutputStream fos = new FileOutputStream(cacheFile);
                          fos.write(decodedBytes);
                          fos.flush();
                          fos.close();

                          Uri contentUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".provider", cacheFile);

                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mimeType);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, caption);
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                          shareIntent.setPackage("com.whatsapp");
                          try {
                              startActivity(shareIntent);
                          } catch (Exception e) {
                              shareIntent.setPackage(null);
                              startActivity(Intent.createChooser(shareIntent, "Kirim Nota ke WhatsApp"));
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal membagikan: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }

                  @JavascriptInterface
                  public void saveFile(String base64Data, String fileName, String mimeType) {
                      try {
                          String pureBase64 = base64Data.contains(",") ? base64Data.split(",")[1] : base64Data;
                          byte[] decodedBytes = Base64.decode(pureBase64, Base64.DEFAULT);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  os.write(decodedBytes);
                                  os.close();
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File file = new File(dir, fileName);
                              FileOutputStream fos = new FileOutputStream(file);
                              fos.write(decodedBytes);
                              fos.close();
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "✅ Tersimpan di folder Download: " + fileName, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal menyimpan: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: 5. Compile APK dengan Gradle
        working-directory: ./android-app
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug

      - name: 6. Upload File APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Nota-MH-MEDIA-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
