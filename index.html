<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MH MEDIA Invoice</title>
  <meta name="theme-color" content="#2b1d28">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #8b4367;
      --primary-dark: #2b1d28;
      --bg-soft: #f8f5f7;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-soft);
      color: var(--text-main);
      padding-bottom: 100px;
    }

    /* Hero Header */
    .hero-header {
      background: linear-gradient(135deg, #2b1d28 0%, #5c2c45 100%);
      color: #fff;
      padding: 20px 18px 28px 18px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 8px 25px rgba(43, 29, 40, 0.2);
    }

    .header-top {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .brand-text span {
      font-size: 11px;
      color: #ebd5de;
      display: block;
    }

    .btn-dice {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-dice:active {
      transform: scale(0.95);
    }

    /* Banner Total */
    .summary-banner {
      max-width: 520px;
      margin: -18px auto 14px auto;
      padding: 0 14px;
    }

    .summary-inner {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #f1e4ea;
    }

    .summary-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .summary-value {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary);
    }

    .pill-status {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #15803d;
    }

    /* Container Utama */
    .main-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 14px;
    }

    .glass-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 10px;
    }

    /* Item Card */
    .item-card {
      background: #fdfbfc;
      border: 1.5px solid #efe4ea;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .item-header {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-badge {
      background: var(--primary);
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-remove {
      background: #ffe4e6;
      color: #e11d48;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-add-item {
      background: linear-gradient(135deg, #8b4367 0%, #632a46 100%);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Accordion Kalibrasi */
    details {
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      margin-top: 10px;
    }

    summary {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    summary::after { content: "▼"; font-size: 10px; color: #94a3b8; }
    details[open] summary::after { content: "▲"; }

    /* Preview Frame */
    .preview-frame {
      background: #e2e8f0;
      padding: 10px;
      border-radius: 14px;
    }

    #nota-canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    /* Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      z-index: 90;
      border-top: 1px solid #f1f5f9;
    }

    .bottom-inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 10px;
    }

    .btn-main {
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
    }

    .btn-save-pdf { background: #1e293b; }
    .btn-share-wa {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    /* Modal Share WA */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 22px;
      padding: 22px 18px;
      text-align: center;
    }

    .modal-sheet h3 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .modal-sheet p { font-size: 12px; color: #64748b; margin-bottom: 18px; }

    .btn-sheet {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- HERO HEADER -->
  <div class="hero-header">
    <div class="header-top">
      <div class="brand-badge">
        <div class="brand-icon">🎬</div>
        <div class="brand-text">
          <h1>MH MEDIA</h1>
          <span>Invoice Studio</span>
        </div>
      </div>
      <button type="button" class="btn-dice" onclick="acakFaktur()">🎲 Acak Faktur</button>
    </div>
  </div>

  <!-- BANNER TOTAL -->
  <div class="summary-banner">
    <div class="summary-inner">
      <div>
        <div class="summary-label">Total Tagihan Aktif</div>
        <div class="summary-value" id="banner-total">Rp 0</div>
      </div>
      <span id="status-template" class="pill-status">⏳ Memuat...</span>
    </div>
  </div>

  <div class="main-wrap">
    <!-- 1. INFORMASI TAGIHAN -->
    <div class="glass-card">
      <div class="card-head">
        <div class="card-title">👤 Tujuan & Tanggal Tagihan</div>
      </div>

      <div class="form-group">
        <label>Tagihan Untuk (Nama Klien & Alamat)</label>
        <textarea id="in-klien" rows="2" oninput="renderNota()">Nama Pelanggan
Alamat Pelanggan</textarea>
      </div>

      <div class="row-2">
        <div>
          <label>Tanggal Nota</label>
          <input type="text" id="in-tanggal" value="22 Oktober 2026" oninput="renderNota()">
        </div>
        <div>
          <label>Nomor Faktur</label>
          <input type="text" id="in-faktur" value="1311" oninput="renderNota()">
        </div>
      </div>
    </div>

    <!-- 2. DAFTAR ITEM LAYANAN -->
    <div class="glass-card">
      <div class="card-head">
        <div class="card-title">📋 Rincian Layanan</div>
        <button type="button" class="btn-add-item" onclick="tambahBaris()">+ Tambah Baris</button>
      </div>

      <div id="items-list"></div>

      <!-- Pengaturan Kalibrasi Halus (Jika dibutuhkan) -->
      <details>
        <summary>⚙️ Kalibrasi Posisi Teks (Halus)</summary>
        <div style="margin-top: 12px;">
          <div class="row-2" style="margin-bottom:8px;">
            <div>
              <label>Y No Faktur (Default: 142)</label>
              <input type="number" id="pos-y-faktur" value="142" oninput="renderNota()">
            </div>
            <div>
              <label>Y Tanggal (Default: 232)</label>
              <input type="number" id="pos-y-tanggal" value="232" oninput="renderNota()">
            </div>
          </div>
          <div class="row-2" style="margin-bottom:8px;">
            <div>
              <label>X Tanggal (Default: 584)</label>
              <input type="number" id="pos-x-tanggal" value="584" oninput="renderNota()">
            </div>
            <div>
              <label>Y Klien (Default: 271)</label>
              <input type="number" id="pos-y-klien" value="271" oninput="renderNota()">
            </div>
          </div>
          <div class="row-2">
            <div>
              <label>Y Header Tabel (Default: 375)</label>
              <input type="number" id="pos-y-header" value="375" oninput="renderNota()">
            </div>
            <div>
              <label>Batas Y Bawah / QRIS (Default: 705)</label>
              <input type="number" id="pos-y-max" value="705" oninput="renderNota()">
            </div>
          </div>
        </div>
      </details>
    </div>

    <!-- 3. LIVE PREVIEW CANVAS -->
    <div class="glass-card">
      <div class="card-head">
        <div class="card-title">Preview Nota</div>
        <small style="font-size:11px; color:#64748b; font-weight:600;">Auto Fit</small>
      </div>
      <div class="preview-frame">
        <canvas id="nota-canvas" width="794" height="1123"></canvas>
      </div>
    </div>
  </div>

  <!-- TOMBOL BAWAH -->
  <div class="bottom-bar">
    <div class="bottom-inner">
      <button type="button" class="btn-main btn-save-pdf" onclick="unduhPDF()">
        📥 Download PDF
      </button>
      <button type="button" class="btn-main btn-share-wa" onclick="siapkanDanBukaModalWA()">
        📲 Share WA
      </button>
    </div>
  </div>

  <!-- MODAL SHARE WA -->
  <div class="modal-backdrop" id="modal-wa" onclick="if(event.target===this) tutupModalWA()">
    <div class="modal-sheet">
      <h3>Kirim Nota ke WhatsApp</h3>
      <p>Pilih format nota yang ingin dibagikan ke WhatsApp:</p>
      <button type="button" class="btn-sheet" style="background:#10b981;" onclick="kirimLangsungWA('pdf')">
        📄 Kirim Dokumen PDF
      </button>
      <button type="button" class="btn-sheet" style="background:#3b82f6;" onclick="kirimLangsungWA('jpg')">
        🖼️ Kirim Gambar (JPG)
      </button>
      <button type="button" class="btn-sheet" style="background:#f1f5f9; color:#334155; margin-bottom:0;" onclick="tutupModalWA()">
        Batal
      </button>
    </div>
  </div>

<script>
  // URL Gambar Background Anda (Sudah termasuk QRIS, Rekening BCA, dan TTD)
  const BG_URL = "https://iili.io/npsZkrv.jpg";

  const canvas = document.getElementById('nota-canvas');
  const ctx = canvas.getContext('2d');
  let bgImg = null;

  let siapFilePDF = null;
  let siapFileJPG = null;

  let items = [
    { ket: "Record + Arransemen", harga: 0, qty: 0 },
    { ket: "Editing", harga: 0, qty: 0 },
    { ket: "Mixing - Mastering", harga: 0, qty: 0 },
    { ket: "Sewa Studio Take Vocal", harga: 0, qty: 0 },
    { ket: "Revisi", harga: 0, qty: 0 }
  ];

  function formatRp(n) {
    return "Rp " + (Number(n) || 0).toLocaleString('id-ID');
  }

  function acakFaktur() {
    document.getElementById('in-faktur').value = Math.floor(1000 + Math.random() * 9000);
    renderNota();
  }

  function muatBackground() {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      bgImg = img;
      document.getElementById('status-template').innerText = "✅ Template Aktif";
      renderNota();
    };
    img.onerror = function() {
      document.getElementById('status-template').innerText = "⚠️ Gagal Muat BG";
      renderNota();
    };
    img.src = BG_URL;
  }

  function renderEditorItems() {
    const list = document.getElementById('items-list');
    list.innerHTML = '';

    items.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const head = document.createElement('div');
      head.className = 'item-header';

      const badge = document.createElement('div');
      badge.className = 'item-badge';
      badge.innerText = idx + 1;

      const inKet = document.createElement('input');
      inKet.type = 'text';
      inKet.value = item.ket;
      inKet.placeholder = 'Nama Layanan / Keterangan';
      inKet.oninput = function() {
        items[idx].ket = this.value;
        renderNota();
      };

      const btnDel = document.createElement('button');
      btnDel.type = 'button';
      btnDel.className = 'btn-remove';
      btnDel.innerText = '✕';
      btnDel.onclick = function() {
        items.splice(idx, 1);
        renderEditorItems();
        renderNota();
      };

      head.appendChild(badge);
      head.appendChild(inKet);
      head.appendChild(btnDel);

      const row2 = document.createElement('div');
      row2.className = 'row-2';

      const colH = document.createElement('div');
      const lblH = document.createElement('label');
      lblH.innerText = 'Harga Satuan (Rp)';
      const inH = document.createElement('input');
      inH.type = 'number';
      inH.value = item.harga;
      inH.oninput = function() {
        items[idx].harga = Number(this.value) || 0;
        renderNota();
      };
      colH.appendChild(lblH);
      colH.appendChild(inH);

      const colQ = document.createElement('div');
      const lblQ = document.createElement('label');
      lblQ.innerText = 'Jumlah (Isi 0 jika -)';
      const inQ = document.createElement('input');
      inQ.type = 'number';
      inQ.value = item.qty;
      inQ.oninput = function() {
        items[idx].qty = Number(this.value) || 0;
        renderNota();
      };
      colQ.appendChild(lblQ);
      colQ.appendChild(inQ);

      row2.appendChild(colH);
      row2.appendChild(colQ);

      card.appendChild(head);
      card.appendChild(row2);
      list.appendChild(card);
    });
  }

  function tambahBaris() {
    items.push({ ket: "Layanan Tambahan", harga: 0, qty: 0 });
    renderEditorItems();
    renderNota();
  }

  // FUNGSI RENDER NOTA PRESISI (HANYA MENGGAMBAR TEKS YANG KOSONG DI TEMPLATE)
  function renderNota() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Gambar Background Asli (Sudah ada QRIS, BCA, TTD)
    if (bgImg) {
      ctx.drawImage(bgImg, 0, 0, 794, 1123);
    }

    ctx.fillStyle = "#222222";
    ctx.textBaseline = "alphabetic";

    const yFaktur  = Number(document.getElementById('pos-y-faktur').value) || 128;
    const yTanggal = Number(document.getElementById('pos-y-tanggal').value) || 215;
    const xTanggal = Number(document.getElementById('pos-x-tanggal').value) || 590;
    const yKlien   = Number(document.getElementById('pos-y-klien').value) || 254;
    const yHeader  = Number(document.getElementById('pos-y-header').value) || 382;
    const yMax     = Number(document.getElementById('pos-y-max').value) || 705;

    // 2. Teks Nomor Faktur (Di bawah tulisan NO FAKTUR)
    const noFaktur = document.getElementById('in-faktur').value;
    ctx.font = "500 17px 'Montserrat', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("#" + noFaktur, 648, yFaktur);

    // 3. Teks Tanggal (Sejajar tepat di sebelah kanan tulisan "Tanggal :")
    const tanggal = document.getElementById('in-tanggal').value;
    ctx.font = "400 15.5px 'Montserrat', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(tanggal, xTanggal, yTanggal);

    // 4. Teks Tagihan Untuk (Di bawah tulisan "Tagihan Untuk:")
    const klienLines = document.getElementById('in-klien').value.split('\n');
    ctx.font = "400 16.5px 'Montserrat', sans-serif";
    ctx.textAlign = "left";
    klienLines.forEach((line, idx) => {
      ctx.fillText(line, 83, yKlien + (idx * 24));
    });

    // 5. Gambar Header Tabel (KETERANGAN, HARGA, JUMLAH, TOTAL) + Garis Bawah Header
    ctx.font = "600 16.5px 'Montserrat', sans-serif";
    ctx.fillStyle = "#222222";

    ctx.textAlign = "left";
    ctx.fillText("KETERANGAN", 80, yHeader);

    ctx.textAlign = "center";
    ctx.fillText("HARGA", 435, yHeader);
    ctx.fillText("JUMLAH", 545, yHeader);

    ctx.textAlign = "right";
    ctx.fillText("TOTAL", 714, yHeader);

    const yGarisHeader = yHeader + 15;
    ctx.beginPath();
    ctx.strokeStyle = "#333333";
    ctx.lineWidth = 1.4;
    ctx.moveTo(80, yGarisHeader);
    ctx.lineTo(714, yGarisHeader);
    ctx.stroke();

    // 6. Sistem Smart Auto-Scale Baris Tabel (Supaya Tidak Pernah Nabrak QRIS di Y=735)
    const jumlahBaris = Math.max(1, items.length);
    const ruangTersedia = (yMax - 42) - yGarisHeader; // Sisakan 42px untuk baris TOTAL di bawah tabel
    const tinggiBaris = Math.min(48, Math.floor(ruangTersedia / jumlahBaris));
    const ukuranFontItem = tinggiBaris < 34 ? 13.5 : (tinggiBaris < 40 ? 14.5 : 16);
    const offsetGaris = Math.floor(tinggiBaris * 0.34);

    let yCursor = yGarisHeader + tinggiBaris - offsetGaris;
    let grandTotal = 0;

    items.forEach((item) => {
      const isZero = item.qty <= 0 || item.harga <= 0;
      const sub = isZero ? 0 : (item.harga * item.qty);
      grandTotal += sub;

      ctx.font = `400 ${ukuranFontItem}px 'Montserrat', sans-serif`;
      ctx.fillStyle = "#222222";

      // Keterangan
      ctx.textAlign = "left";
      ctx.fillText(item.ket, 80, yCursor);

      // Harga
      ctx.textAlign = "center";
      ctx.fillText(formatRp(item.harga), 435, yCursor);

      // Jumlah
      ctx.fillText(item.qty > 0 ? String(item.qty) : "-", 545, yCursor);

      // Total per baris
      ctx.textAlign = "right";
      ctx.fillText(formatRp(sub), 714, yCursor);

      // Garis Bawah Baris
      const yGarisBaris = yCursor + offsetGaris;
      ctx.beginPath();
      ctx.strokeStyle = "#666666";
      ctx.lineWidth = 1;
      ctx.moveTo(80, yGarisBaris);
      ctx.lineTo(714, yGarisBaris);
      ctx.stroke();

      yCursor += tinggiBaris;
    });

    // Update Banner Total di Aplikasi
    document.getElementById('banner-total').innerText = formatRp(grandTotal);

    // 7. Gambar GRAND TOTAL (Tepat di bawah garis baris terakhir, aman di atas kotak BCA)
    const yGarisTerakhir = yCursor - tinggiBaris + offsetGaris;
    const yGrandTotal = yGarisTerakhir + 34;

    ctx.font = "700 20px 'Montserrat', sans-serif";
    ctx.fillStyle = "#222222";
    ctx.textAlign = "left";
    ctx.fillText("TOTAL", 390, yGrandTotal);

    ctx.textAlign = "right";
    ctx.fillText(formatRp(grandTotal), 714, yGrandTotal);
  }

  // EXPORT PDF & SHARE WHATSAPP
  function buatPDFInstance() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'px',
      format: [794, 1123]
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.96);
    pdf.addImage(imgData, 'JPEG', 0, 0, 794, 1123);
    return pdf;
  }

  function unduhPDF() {
    renderNota();
    const noFaktur = document.getElementById('in-faktur').value;
    buatPDFInstance().save(`Invoice_MH_MEDIA_${noFaktur}.pdf`);
  }

  function siapkanDanBukaModalWA() {
    renderNota();
    const noFaktur = document.getElementById('in-faktur').value;

    const pdfBlob = buatPDFInstance().output('blob');
    siapFilePDF = new File([pdfBlob], `Invoice_MH_MEDIA_${noFaktur}.pdf`, { type: 'application/pdf' });

    const dataUrl = canvas.toDataURL('image/jpeg', 0.96);
    const byteString = atob(dataUrl.split(',')[1]);
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    const jpgBlob = new Blob([ab], { type: 'image/jpeg' });
    siapFileJPG = new File([jpgBlob], `Invoice_MH_MEDIA_${noFaktur}.jpg`, { type: 'image/jpeg' });

    document.getElementById('modal-wa').style.display = 'flex';
  }

  function tutupModalWA() {
    document.getElementById('modal-wa').style.display = 'none';
  }

  function buatTeksCaptionWA() {
    const noFaktur = document.getElementById('in-faktur').value;
    const klien = document.getElementById('in-klien').value.split('\n')[0];
    const tanggal = document.getElementById('in-tanggal').value;
    const total = document.getElementById('banner-total').innerText;

    return `Halo *${klien}*,\nBerikut kami lampirkan Invoice *MH MEDIA*:\n\n📄 *No. Faktur:* #${noFaktur}\n📅 *Tanggal:* ${tanggal}\n💰 *Total Tagihan:* ${total}\n\nTerima kasih! 🙏`;
  }

  function kirimLangsungWA(format) {
    tutupModalWA();
    const filePilihan = format === 'pdf' ? siapFilePDF : siapFileJPG;
    const caption = buatTeksCaptionWA();

    // Di HP Android (Chrome), langsung membuka Share Sheet untuk memilih aplikasi WhatsApp
    if (navigator.canShare && navigator.canShare({ files: [filePilihan] })) {
      navigator.share({
        files: [filePilihan],
        title: filePilihan.name,
        text: caption
      }).catch(err => console.log("Batal share:", err));
    } else {
      // Di Laptop/MacBook (Firefox desktop tidak mendukung share file langsung ke aplikasi WA),
      // otomatis membuka aplikasi WhatsApp Desktop/Web dengan teks tagihan
      window.location.href = `whatsapp://send?text=${encodeURIComponent(caption)}`;
    }
  }

  renderEditorItems();
  muatBackground();
</script>

</body>
</html>
